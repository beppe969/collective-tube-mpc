name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify archive before dependency installation
        run: python reproduce.py check-reference
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and archived-result checks
        run: python -m unittest discover -s tests -v
      - name: Numerical smoke test
        run: python reproduce.py smoke --output runs/ci-smoke
      - name: Regenerate all paper assets from archived results
        run: python reproduce.py assets --output runs/ci-assets
      - name: Audit archived numerical results
        run: python reproduce.py verify --report runs/ci-reference-verification.json
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-checks
          path: runs/
          if-no-files-found: warn
          retention-days: 14
